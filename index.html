<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft HTML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #87CEEB;
            font-family: 'Courier New', monospace;
        }

        #gameCanvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            mix-blend-mode: difference;
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
        }

        #hotbar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
            z-index: 100;
        }

        .slot {
            width: 50px;
            height: 50px;
            background: rgba(139, 139, 139, 0.8);
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
        }

        .slot.selected {
            border-color: white;
            box-shadow: 0 0 10px white;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 100;
            font-size: 14px;
            line-height: 1.6;
        }

        #instructions {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            text-shadow: 2px 2px 2px black;
            z-index: 100;
            font-size: 12px;
            text-align: right;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #4a90c2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #startScreen h1 {
            font-size: 72px;
            color: #3d3d3d;
            text-shadow: 4px 4px 0 #8B4513, 8px 8px 0 rgba(0,0,0,0.3);
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        #startBtn {
            padding: 20px 60px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: 4px solid #2d5a30;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        #startBtn:hover {
            transform: scale(1.05);
            background: #5CBF60;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>MINECRAFT</h1>
        <button id="startBtn">▶ ИГРАТЬ</button>
        <p style="margin-top: 30px; color: #333;">Нажмите для захвата мыши</p>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="crosshair"></div>
    
    <div id="info">
        <div>Позиция: <span id="position">0, 0, 0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div id="instructions">
        WASD - движение<br>
        ПРОБЕЛ - прыжок<br>
        SHIFT - вниз<br>
        ЛКМ - сломать блок<br>
        ПКМ - поставить блок<br>
        1-6 - выбор блока<br>
        ESC - освободить мышь
    </div>

    <div id="hotbar">
        <div class="slot selected" data-block="1">🟫</div>
        <div class="slot" data-block="2">🟩</div>
        <div class="slot" data-block="3">⬜</div>
        <div class="slot" data-block="4">🪨</div>
        <div class="slot" data-block="5">🪵</div>
        <div class="slot" data-block="6">🌳</div>
    </div>

    <script>
        // ============ ИНИЦИАЛИЗАЦИЯ ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ============ КОНСТАНТЫ ============
        const CHUNK_SIZE = 16;
        const WORLD_HEIGHT = 32;
        const BLOCK_SIZE = 1;
        const RENDER_DISTANCE = 4;

        // Типы блоков
        const BLOCKS = {
            AIR: 0,
            DIRT: 1,
            GRASS: 2,
            STONE: 3,
            COBBLESTONE: 4,
            WOOD: 5,
            LEAVES: 6,
            SAND: 7,
            WATER: 8,
            BEDROCK: 9
        };

        // Цвета блоков
        const BLOCK_COLORS = {
            [BLOCKS.DIRT]: { top: '#8B4513', side: '#6B3510', bottom: '#5a2d0d' },
            [BLOCKS.GRASS]: { top: '#228B22', side: '#8B4513', bottom: '#6B3510' },
            [BLOCKS.STONE]: { top: '#808080', side: '#696969', bottom: '#585858' },
            [BLOCKS.COBBLESTONE]: { top: '#6a6a6a', side: '#5a5a5a', bottom: '#4a4a4a' },
            [BLOCKS.WOOD]: { top: '#8B7355', side: '#654321', bottom: '#8B7355' },
            [BLOCKS.LEAVES]: { top: '#228B22', side: '#1a6b1a', bottom: '#0f4f0f' },
            [BLOCKS.SAND]: { top: '#F4D03F', side: '#D4AC0D', bottom: '#B7950B' },
            [BLOCKS.WATER]: { top: '#4169E1', side: '#3158c4', bottom: '#2147a7' },
            [BLOCKS.BEDROCK]: { top: '#1a1a1a', side: '#0d0d0d', bottom: '#000000' }
        };

        // ============ ИГРОК ============
        const player = {
            x: 8,
            y: 20,
            z: 8,
            yaw: 0,
            pitch: 0,
            velocityY: 0,
            onGround: false,
            speed: 0.1,
            jumpForce: 0.15,
            height: 1.8,
            width: 0.6
        };

        // ============ СОСТОЯНИЕ ИГРЫ ============
        let selectedBlock = 1;
        let keys = {};
        let isPointerLocked = false;
        let world = {};
        let frameCount = 0;
        let lastTime = performance.now();
        let fps = 0;

        // ============ ГЕНЕРАЦИЯ МИРА ============
        function noise2D(x, z) {
            const n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function smoothNoise(x, z) {
            const corners = (noise2D(x-1, z-1) + noise2D(x+1, z-1) + 
                           noise2D(x-1, z+1) + noise2D(x+1, z+1)) / 16;
            const sides = (noise2D(x-1, z) + noise2D(x+1, z) + 
                         noise2D(x, z-1) + noise2D(x, z+1)) / 8;
            const center = noise2D(x, z) / 4;
            return corners + sides + center;
        }

        function interpolatedNoise(x, z) {
            const intX = Math.floor(x);
            const fracX = x - intX;
            const intZ = Math.floor(z);
            const fracZ = z - intZ;

            const v1 = smoothNoise(intX, intZ);
            const v2 = smoothNoise(intX + 1, intZ);
            const v3 = smoothNoise(intX, intZ + 1);
            const v4 = smoothNoise(intX + 1, intZ + 1);

            const i1 = v1 * (1 - fracX) + v2 * fracX;
            const i2 = v3 * (1 - fracX) + v4 * fracX;

            return i1 * (1 - fracZ) + i2 * fracZ;
        }

        function getHeight(x, z) {
            let height = 0;
            height += interpolatedNoise(x * 0.05, z * 0.05) * 10;
            height += interpolatedNoise(x * 0.1, z * 0.1) * 5;
            height += interpolatedNoise(x * 0.2, z * 0.2) * 2;
            return Math.floor(height + 10);
        }

        function generateChunk(chunkX, chunkZ) {
            const key = `${chunkX},${chunkZ}`;
            if (world[key]) return;

            world[key] = {};

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const worldX = chunkX * CHUNK_SIZE + x;
                    const worldZ = chunkZ * CHUNK_SIZE + z;
                    const height = getHeight(worldX, worldZ);

                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        let blockType = BLOCKS.AIR;

                        if (y === 0) {
                            blockType = BLOCKS.BEDROCK;
                        } else if (y < height - 4) {
                            blockType = BLOCKS.STONE;
                        } else if (y < height) {
                            blockType = BLOCKS.DIRT;
                        } else if (y === height) {
                            blockType = BLOCKS.GRASS;
                        }

                        if (blockType !== BLOCKS.AIR) {
                            setBlock(worldX, y, worldZ, blockType);
                        }
                    }

                    // Деревья
                    if (height > 5 && noise2D(worldX * 0.3, worldZ * 0.3) > 0.85) {
                        generateTree(worldX, height + 1, worldZ);
                    }
                }
            }
        }

        function generateTree(x, y, z) {
            // Ствол
            for (let i = 0; i < 5; i++) {
                setBlock(x, y + i, z, BLOCKS.WOOD);
            }
            // Листва
            for (let dx = -2; dx <= 2; dx++) {
                for (let dz = -2; dz <= 2; dz++) {
                    for (let dy = 3; dy <= 6; dy++) {
                        if (Math.abs(dx) + Math.abs(dz) + Math.abs(dy - 5) < 4) {
                            if (getBlock(x + dx, y + dy, z + dz) === BLOCKS.AIR) {
                                setBlock(x + dx, y + dy, z + dz, BLOCKS.LEAVES);
                            }
                        }
                    }
                }
            }
        }

        function getBlockKey(x, y, z) {
            return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
        }

        function getChunkKey(x, z) {
            return `${Math.floor(x / CHUNK_SIZE)},${Math.floor(z / CHUNK_SIZE)}`;
        }

        function setBlock(x, y, z, type) {
            const chunkKey = getChunkKey(x, z);
            if (!world[chunkKey]) world[chunkKey] = {};
            world[chunkKey][getBlockKey(x, y, z)] = type;
        }

        function getBlock(x, y, z) {
            const chunkKey = getChunkKey(x, z);
            if (!world[chunkKey]) return BLOCKS.AIR;
            return world[chunkKey][getBlockKey(x, y, z)] || BLOCKS.AIR;
        }

        function removeBlock(x, y, z) {
            const chunkKey = getChunkKey(x, z);
            if (world[chunkKey]) {
                delete world[chunkKey][getBlockKey(x, y, z)];
            }
        }

        // ============ РЕНДЕРИНГ ============
        function project(x, y, z) {
            // Относительно игрока
            let dx = x - player.x;
            let dy = y - player.y - 1.6; // Высота глаз
            let dz = z - player.z;

            // Поворот по yaw
            const cosYaw = Math.cos(player.yaw);
            const sinYaw = Math.sin(player.yaw);
            let nx = dx * cosYaw - dz * sinYaw;
            let nz = dx * sinYaw + dz * cosYaw;
            dx = nx;
            dz = nz;

            // Поворот по pitch
            const cosPitch = Math.cos(player.pitch);
            const sinPitch = Math.sin(player.pitch);
            let ny = dy * cosPitch - dz * sinPitch;
            nz = dy * sinPitch + dz * cosPitch;
            dy = ny;
            dz = nz;

            if (dz <= 0.1) return null;

            const fov = 500;
            const screenX = (dx / dz) * fov + canvas.width / 2;
            const screenY = (-dy / dz) * fov + canvas.height / 2;

            return { x: screenX, y: screenY, z: dz };
        }

        function drawFace(vertices, color, depth) {
            const projected = vertices.map(v => project(v.x, v.y, v.z)).filter(p => p !== null);
            if (projected.length < 3) return null;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(projected[0].x, projected[0].y);
            for (let i = 1; i < projected.length; i++) {
                ctx.lineTo(projected[i].x, projected[i].y);
            }
            ctx.closePath();
            ctx.fill();

            // Границы
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            return Math.min(...projected.map(p => p.z));
        }

        function renderBlock(x, y, z, blockType) {
            const colors = BLOCK_COLORS[blockType];
            if (!colors) return [];

            const faces = [];
            const s = BLOCK_SIZE;

            // Проверяем соседние блоки для оптимизации
            const neighbors = {
                top: getBlock(x, y + 1, z) === BLOCKS.AIR,
                bottom: getBlock(x, y - 1, z) === BLOCKS.AIR,
                front: getBlock(x, y, z + 1) === BLOCKS.AIR,
                back: getBlock(x, y, z - 1) === BLOCKS.AIR,
                right: getBlock(x + 1, y, z) === BLOCKS.AIR,
                left: getBlock(x - 1, y, z) === BLOCKS.AIR
            };

            // Верхняя грань
            if (neighbors.top) {
                faces.push({
                    vertices: [
                        {x: x, y: y + s, z: z},
                        {x: x + s, y: y + s, z: z},
                        {x: x + s, y: y + s, z: z + s},
                        {x: x, y: y + s, z: z + s}
                    ],
                    color: colors.top,
                    center: {x: x + 0.5, y: y + 1, z: z + 0.5}
                });
            }

            // Нижняя грань
            if (neighbors.bottom) {
                faces.push({
                    vertices: [
                        {x: x, y: y, z: z},
                        {x: x, y: y, z: z + s},
                        {x: x + s, y: y, z: z + s},
                        {x: x + s, y: y, z: z}
                    ],
                    color: colors.bottom,
                    center: {x: x + 0.5, y: y, z: z + 0.5}
                });
            }

            // Передняя грань
            if (neighbors.front) {
                faces.push({
                    vertices: [
                        {x: x, y: y, z: z + s},
                        {x: x, y: y + s, z: z + s},
                        {x: x + s, y: y + s, z: z + s},
                        {x: x + s, y: y, z: z + s}
                    ],
                    color: colors.side,
                    center: {x: x + 0.5, y: y + 0.5, z: z + 1}
                });
            }

            // Задняя грань
            if (neighbors.back) {
                faces.push({
                    vertices: [
                        {x: x, y: y, z: z},
                        {x: x + s, y: y, z: z},
                        {x: x + s, y: y + s, z: z},
                        {x: x, y: y + s, z: z}
                    ],
                    color: colors.side,
                    center: {x: x + 0.5, y: y + 0.5, z: z}
                });
            }

            // Правая грань
            if (neighbors.right) {
                faces.push({
                    vertices: [
                        {x: x + s, y: y, z: z},
                        {x: x + s, y: y, z: z + s},
                        {x: x + s, y: y + s, z: z + s},
                        {x: x + s, y: y + s, z: z}
                    ],
                    color: colors.side,
                    center: {x: x + 1, y: y + 0.5, z: z + 0.5}
                });
            }

            // Левая грань
            if (neighbors.left) {
                faces.push({
                    vertices: [
                        {x: x, y: y, z: z},
                        {x: x, y: y + s, z: z},
                        {x: x, y: y + s, z: z + s},
                        {x: x, y: y, z: z + s}
                    ],
                    color: colors.side,
                    center: {x: x, y: y + 0.5, z: z + 0.5}
                });
            }

            return faces;
        }

        function render() {
            // Небо
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Собираем все грани
            const allFaces = [];
            const playerChunkX = Math.floor(player.x / CHUNK_SIZE);
            const playerChunkZ = Math.floor(player.z / CHUNK_SIZE);

            for (let cx = playerChunkX - RENDER_DISTANCE; cx <= playerChunkX + RENDER_DISTANCE; cx++) {
                for (let cz = playerChunkZ - RENDER_DISTANCE; cz <= playerChunkZ + RENDER_DISTANCE; cz++) {
                    generateChunk(cx, cz);
                    const chunkKey = `${cx},${cz}`;
                    const chunk = world[chunkKey];
                    if (!chunk) continue;

                    for (const blockKey in chunk) {
                        const [x, y, z] = blockKey.split(',').map(Number);
                        const blockType = chunk[blockKey];
                        
                        // Отсекаем далёкие блоки
                        const dx = x - player.x;
                        const dz = z - player.z;
                        const dist = dx * dx + dz * dz;
                        if (dist > (RENDER_DISTANCE * CHUNK_SIZE) ** 2) continue;

                        const faces = renderBlock(x, y, z, blockType);
                        allFaces.push(...faces);
                    }
                }
            }

            // Сортируем по глубине
            allFaces.sort((a, b) => {
                const distA = Math.sqrt(
                    (a.center.x - player.x) ** 2 + 
                    (a.center.y - player.y) ** 2 + 
                    (a.center.z - player.z) ** 2
                );
                const distB = Math.sqrt(
                    (b.center.x - player.x) ** 2 + 
                    (b.center.y - player.y) ** 2 + 
                    (b.center.z - player.z) ** 2
                );
                return distB - distA;
            });

            // Рисуем
            for (const face of allFaces) {
                drawFace(face.vertices, face.color, 0);
            }

            // Обновляем UI
            document.getElementById('position').textContent = 
                `${player.x.toFixed(1)}, ${player.y.toFixed(1)}, ${player.z.toFixed(1)}`;
        }

        // ============ ФИЗИКА ============
        function checkCollision(x, y, z) {
            const hw = player.width / 2;
            const positions = [
                [x - hw, y, z - hw],
                [x + hw, y, z - hw],
                [x - hw, y, z + hw],
                [x + hw, y, z + hw],
                [x - hw, y + 1, z - hw],
                [x + hw, y + 1, z - hw],
                [x - hw, y + 1, z + hw],
                [x + hw, y + 1, z + hw]
            ];

            for (const [px, py, pz] of positions) {
                if (getBlock(Math.floor(px), Math.floor(py), Math.floor(pz)) !== BLOCKS.AIR) {
                    return true;
                }
            }
            return false;
        }

        function update() {
            // Движение
            let moveX = 0;
            let moveZ = 0;

            if (keys['KeyW']) moveZ -= 1;
            if (keys['KeyS']) moveZ += 1;
            if (keys['KeyA']) moveX -= 1;
            if (keys['KeyD']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= len;
                moveZ /= len;

                const cos = Math.cos(player.yaw);
                const sin = Math.sin(player.yaw);
                const dx = (moveX * cos - moveZ * sin) * player.speed;
                const dz = (moveX * sin + moveZ * cos) * player.speed;

                if (!checkCollision(player.x + dx, player.y, player.z)) {
                    player.x += dx;
                }
                if (!checkCollision(player.x, player.y, player.z + dz)) {
                    player.z += dz;
                }
            }

            // Гравитация
            player.velocityY -= 0.008;
            const newY = player.y + player.velocityY;

            if (checkCollision(player.x, newY, player.z)) {
                if (player.velocityY < 0) {
                    player.onGround = true;
                }
                player.velocityY = 0;
            } else {
                player.y = newY;
                player.onGround = false;
            }

            // Прыжок
            if (keys['Space'] && player.onGround) {
                player.velocityY = player.jumpForce;
                player.onGround = false;
            }

            // Полёт вниз (для креатива)
            if (keys['ShiftLeft']) {
                player.y -= 0.1;
            }
        }

        // ============ РАЙКАСТИНГ ============
        function raycast(maxDistance = 5) {
            const step = 0.1;
            let x = player.x;
            let y = player.y + 1.6;
            let z = player.z;

            const dirX = -Math.sin(player.yaw) * Math.cos(player.pitch);
            const dirY = Math.sin(player.pitch);
            const dirZ = -Math.cos(player.yaw) * Math.cos(player.pitch);

            let prevX = x, prevY = y, prevZ = z;

            for (let d = 0; d < maxDistance; d += step) {
                x = player.x + dirX * d;
                y = player.y + 1.6 + dirY * d;
                z = player.z + dirZ * d;

                const block = getBlock(Math.floor(x), Math.floor(y), Math.floor(z));
                if (block !== BLOCKS.AIR) {
                    return {
                        hit: true,
                        x: Math.floor(x),
                        y: Math.floor(y),
                        z: Math.floor(z),
                        prevX: Math.floor(prevX),
                        prevY: Math.floor(prevY),
                        prevZ: Math.floor(prevZ)
                    };
                }

                prevX = x;
                prevY = y;
                prevZ = z;
            }

            return { hit: false };
        }

        // ============ СОБЫТИЯ ============
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            // Выбор блока 1-6
            if (e.code >= 'Digit1' && e.code <= 'Digit6') {
                const num = parseInt(e.code.charAt(5));
                selectBlock(num);
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            
            player.yaw += e.movementX * 0.002;
            player.pitch += e.movementY * 0.002;
            player.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.pitch));
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isPointerLocked) {
                canvas.requestPointerLock();
                return;
            }

            const result = raycast();
            if (!result.hit) return;

            if (e.button === 0) {
                // ЛКМ - ломаем
                if (getBlock(result.x, result.y, result.z) !== BLOCKS.BEDROCK) {
                    removeBlock(result.x, result.y, result.z);
                }
            } else if (e.button === 2) {
                // ПКМ - ставим
                setBlock(result.prevX, result.prevY, result.prevZ, selectedBlock);
            }
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === canvas;
        });

        function selectBlock(num) {
            selectedBlock = num;
            document.querySelectorAll('.slot').forEach((slot, i) => {
                slot.classList.toggle('selected', i === num - 1);
            });
        }

        document.querySelectorAll('.slot').forEach((slot, i) => {
            slot.addEventListener('click', () => selectBlock(i + 1));
        });

        // ============ СТАРТ ИГРЫ ============
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            canvas.requestPointerLock();
            gameLoop();
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ============ ИГРОВОЙ ЦИКЛ ============
        function gameLoop() {
            update();
            render();

            // FPS
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                document.getElementById('fps').textContent = fps;
            }

            requestAnimationFrame(gameLoop);
        }

        // Генерируем начальные чанки
        for (let x = -2; x <= 2; x++) {
            for (let z = -2; z <= 2; z++) {
                generateChunk(x, z);
            }
        }

        // Устанавливаем игрока на землю
        player.y = getHeight(8, 8) + 3;
    </script>
</body>
</html>
